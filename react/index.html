<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/real-estate-portfolio/react/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Open the connections the first screen needs while the HTML is still arriving: the PDF engine's
         CDN and the font host the theme stylesheet uses. -->
    <link rel="preconnect" href="https://cdn.syncfusion.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Real Estate Portfolio &amp; Site Visit Manager</title>
    <meta
      name="description"
      content="Commercial real estate portfolio, lease, site-visit, due diligence, and acquisition pipeline manager."
    />
    <!-- Loading states: the theme is set before the first paint
         so the startup screen matches it, and the indicator styles live here because the app's CSS and the
         4.8 MB Syncfusion theme bundle have not loaded yet. src/components/LoadingState.tsx reuses them. -->
    <script>
      try {
        var saved = localStorage.getItem('rep_theme_preference_v1');
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) { /* storage blocked: light */ }
    </script>
    <!-- startup-preload -->
    <style>
      :root { --app-loading-bg: #f8fafc; --app-loading-fg: #667085; --app-loading-ring: #175cd3; --app-loading-track: #dbe5f5; }
      :root[data-theme='dark'] { --app-loading-bg: #0f172a; --app-loading-fg: #94a3b8; --app-loading-ring: #60a5fa; --app-loading-track: #1e3a6e; }
      html, body { margin: 0; background: var(--app-loading-bg); }
      .app-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        min-height: 240px; padding: 24px; box-sizing: border-box; color: var(--app-loading-fg);
        font: 500 14px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; }
      .app-loading--screen { position: fixed; inset: 0; min-height: 0; background: var(--app-loading-bg); z-index: 1000; }
      .app-loading--overlay { position: absolute; inset: 0; min-height: 0; background: color-mix(in srgb, var(--app-loading-bg) 88%, transparent); z-index: 5; }
      .app-loading__ring { width: 36px; height: 36px; border-radius: 50%; box-sizing: border-box;
        border: 3px solid var(--app-loading-track); border-top-color: var(--app-loading-ring); animation: app-loading-spin 0.8s linear infinite; }
      @keyframes app-loading-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .app-loading__ring { animation: none; border-color: var(--app-loading-ring); } }
      /* The app frame, drawn by this file before any script or stylesheet arrives: the same size and colours as the real shell (app-shell.css), so React
         takes over underneath it and it is removed without a jump once the theme has loaded. */
      :root { --boot-page: #f6f8fb; --boot-surface: #ffffff; --boot-border: #e5e9f0; --boot-fg: #172033; --boot-muted: #667085; --boot-brand-bg: #eef4ff; --boot-brand-fg: #175cd3; }
      :root[data-theme='dark'] { --boot-page: #020617; --boot-surface: #0f172a; --boot-border: #334155; --boot-fg: #f8fafc; --boot-muted: #94a3b8; --boot-brand-bg: #172554; --boot-brand-fg: #60a5fa; }
      #app-boot { position: fixed; inset: 0; z-index: 1000; display: flex; background: var(--boot-page); color: var(--boot-fg);
        font: 400 12px/1.4 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      .boot-side { flex: 0 0 240px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 12px 0;
        background: var(--boot-surface); border-right: 1px solid var(--boot-border); overflow: hidden; }
      .boot-brand { display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 40px; }
      .boot-logo { flex: 0 0 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
        background: var(--boot-brand-bg); color: var(--boot-brand-fg); font-size: 14px; font-weight: 700; }
      .boot-brand strong { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; }
      .boot-brand small { display: block; font-size: 12px; color: var(--boot-muted); white-space: nowrap; }
      .boot-links { list-style: none; margin: 0; padding: 0 12px; display: grid; gap: 4px; }
      .boot-links li { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 10px; border-radius: 8px; color: var(--boot-muted); white-space: nowrap; }
      .boot-links li.is-current { background: var(--boot-brand-bg); color: var(--boot-brand-fg); font-weight: 600; }
      .boot-links svg { flex: 0 0 20px; }
      .boot-foot { margin-top: auto; padding: 0 16px; color: var(--boot-muted); }
      .boot-work { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .boot-head { flex: 0 0 64px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px;
        background: var(--boot-surface); border-bottom: 1px solid var(--boot-border); }
      .boot-toggle { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--boot-muted); }
      .boot-head strong { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .boot-main { flex: 1; padding: 24px; }
      #app-boot[data-nav='docked'] .boot-side { flex-basis: 64px; }
      #app-boot[data-nav='docked'] .boot-brand > span, #app-boot[data-nav='docked'] .boot-links span, #app-boot[data-nav='docked'] .boot-foot { display: none; }
      #app-boot[data-nav='docked'] .boot-links li { justify-content: center; padding: 0; }
      #app-boot[data-nav='drawer'] .boot-side { display: none; }
      @media (max-width: 1023.98px) { .boot-main { padding: 16px; } }
    </style>
  </head>
  <body>
    <div id="app-boot" aria-busy="true">
      <aside class="boot-side" aria-hidden="true"><div class="boot-brand"><div class="boot-logo">RE</div><span><strong>Real Estate Portfolio</strong><small>Site Visit Manager</small></span></div>
        <ul class="boot-links"><li data-route="portfolio"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg><span>Executive Dashboard</span></li><li data-route="properties"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h4"></path><path d="M10 8h4"></path><path d="M14 21v-3a2 2 0 0 0-4 0v3"></path><path d="M6 10H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-2"></path><path d="M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16"></path></svg><span>Property &amp; Lease Directory</span></li><li data-route="site-visits"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 14v2.2l1.6 1"></path><path d="M16 2v3"></path><path d="M21 7.338V5a2 2 0 00-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h2.338"></path><path d="M3 9h5.859"></path><path d="M8 2v3"></path><circle cx="16" cy="16" r="6"></circle></svg><span>Site Visits &amp; Inspections</span></li><li data-route="due-diligence"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="5" x="14" y="17" rx="1"></rect><path d="M10 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v2.5"></path><path d="M20 17v-2a2 2 0 1 0-4 0v2"></path></svg><span>Due Diligence Vault</span></li><li data-route="pipeline"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 17 2 2a1 1 0 1 0 3-3"></path><path d="m14 14 2.5 2.5a1 1 0 1 0 3-3l-3.88-3.88a3 3 0 0 0-4.24 0l-.88.88a1 1 0 1 1-3-3l2.81-2.81a5.79 5.79 0 0 1 7.06-.87l.47.28a2 2 0 0 0 1.42.25L21 4"></path><path d="m21 3 1 11h-2"></path><path d="M3 3 2 14l6.5 6.5a1 1 0 1 0 3-3"></path><path d="M3 4h8"></path></svg><span>Acquisition Pipeline</span></li></ul><div class="boot-foot">Built with Syncfusion</div></aside>
      <div class="boot-work"><div class="boot-head"><span class="boot-toggle" aria-hidden="true" data-icon-expanded='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="m16 15-3-3 3-3"></path></svg>' data-icon-drawer='<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg>'></span><strong id="boot-title"></strong></div>
        <div class="boot-main"><div class="app-loading" role="status" aria-live="polite"><div class="app-loading__ring" aria-hidden="true"></div><div id="boot-label">Loading…</div></div></div></div>
    </div>
    <script>
      // The frame's layout, title and current link, before the first paint: expanded or docked (the
      // shell's saved choice) from 1024 px, the drawer below; the page from the address.
      (function () {
        var boot = document.getElementById('app-boot');
        var labels = { portfolio: 'Executive Dashboard', properties: 'Property & Lease Directory', 'site-visits': 'Site Visits & Inspections', 'due-diligence': 'Due Diligence Vault', pipeline: 'Acquisition Pipeline' };
        var path = location.pathname.replace(/^\/real-estate-portfolio\/react/, '').replace(/^\//, '').split('/')[0] || 'portfolio';
        var id = labels[path] ? path : 'portfolio';
        var collapsed = false; try { collapsed = localStorage.getItem('real-estate-portfolio-nav-collapsed') === 'true'; } catch (e) {}
        var nav = window.innerWidth < 1024 ? 'drawer' : collapsed ? 'docked' : 'expanded';
        boot.setAttribute('data-nav', nav);
        var toggle = boot.querySelector('.boot-toggle'); toggle.innerHTML = toggle.getAttribute(nav === 'drawer' ? 'data-icon-drawer' : 'data-icon-expanded');
        document.getElementById('boot-title').textContent = labels[id];
        document.getElementById('boot-label').textContent = 'Loading ' + labels[id] + '\u2026';
        var current = boot.querySelector('[data-route="' + id + '"]'); if (current) current.className = 'is-current';
        if (path === 'healthz') boot.remove();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
